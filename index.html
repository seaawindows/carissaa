<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06021a">
<title>Untuk Carissa 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --pink:#ff5fa2;
  --purple:#a855f7;
  --blue:#60a5fa;
  --stroke:rgba(255,255,255,.16);
  --muted:rgba(255,255,255,.62);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
html,body{height:100%;overflow:hidden;background:#06021a;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  position:fixed;inset:0;
  touch-action:pan-y;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;touch-action:manipulation;}
img{display:block;-webkit-user-drag:none;}

/* ============================================================
   BACKGROUND - ringan, tanpa filter blur besar
   ============================================================ */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#06021a;}

.bg-base{
  position:absolute;inset:-4%;
  background:
    radial-gradient(ellipse 70% 55% at 18% 15%, rgba(255,61,143,.5), transparent 62%),
    radial-gradient(ellipse 65% 50% at 82% 20%, rgba(168,85,247,.45), transparent 60%),
    radial-gradient(ellipse 60% 55% at 10% 85%, rgba(99,102,241,.4), transparent 62%),
    radial-gradient(ellipse 65% 50% at 90% 80%, rgba(236,72,153,.42), transparent 62%),
    #06021a;
  animation:bgShift 50s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes bgShift{
  0%{transform:translate3d(0,0,0) scale(1);}
  100%{transform:translate3d(-2%,-2%,0) scale(1.08);}
}

/* Orb tanpa filter:blur — pakai radial-gradient lembut langsung */
.orb{
  position:absolute;border-radius:50%;
  pointer-events:none;
  opacity:.9;
}
.orb-1{
  width:95vw;height:95vw;top:-30%;left:-35%;
  background:radial-gradient(circle, rgba(255,61,143,.55) 0%, rgba(255,61,143,0) 62%);
  animation:orbFloat1 34s ease-in-out infinite;
}
.orb-2{
  width:85vw;height:85vw;bottom:-25%;right:-30%;
  background:radial-gradient(circle, rgba(168,85,247,.5) 0%, rgba(168,85,247,0) 62%);
  animation:orbFloat2 40s ease-in-out infinite;
}
.orb-3{
  width:70vw;height:70vw;top:35%;left:20%;
  background:radial-gradient(circle, rgba(56,189,248,.35) 0%, rgba(56,189,248,0) 62%);
  animation:orbFloat1 46s ease-in-out infinite reverse;
}
@keyframes orbFloat1{
  0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(6vw,4vh,0);}
}
@keyframes orbFloat2{
  0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(-7vw,-5vh,0);}
}

/* Aurora - static, tidak animasi filter */
.aurora-top{
  position:absolute;top:-16%;left:-16%;right:-16%;height:58%;
  background:
    radial-gradient(ellipse at 30% 42%, rgba(255,95,162,.5), transparent 62%),
    radial-gradient(ellipse at 72% 52%, rgba(168,85,247,.45), transparent 62%),
    radial-gradient(ellipse at 50% 30%, rgba(96,165,250,.35), transparent 58%);
  pointer-events:none;
  opacity:.85;
}
.aurora-bottom{
  position:absolute;bottom:-22%;left:-16%;right:-16%;height:55%;
  background:
    radial-gradient(ellipse at 40% 60%, rgba(244,114,182,.45), transparent 62%),
    radial-gradient(ellipse at 65% 42%, rgba(129,140,248,.4), transparent 62%),
    radial-gradient(ellipse at 25% 50%, rgba(232,121,249,.3), transparent 62%);
  pointer-events:none;
  opacity:.85;
}

/* Glass panel - tanpa backdrop-filter (mahal) */
.glass-panel{
  position:absolute;
  border-radius:34px;
  background:linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 32px rgba(0,0,0,.25);
  pointer-events:none;
  opacity:.55;
}
.panel-1{width:170px;height:230px;top:11%;left:-8%;transform:rotate(-18deg);animation:panelFloat1 22s ease-in-out infinite;}
.panel-2{width:140px;height:195px;top:54%;right:-10%;transform:rotate(24deg);animation:panelFloat2 26s ease-in-out infinite;}
.panel-3{width:120px;height:160px;bottom:8%;left:16%;transform:rotate(-12deg);animation:panelFloat3 30s ease-in-out infinite;}
@keyframes panelFloat1{0%,100%{transform:rotate(-18deg) translate3d(0,0,0);}50%{transform:rotate(-14deg) translate3d(14px,-18px,0);}}
@keyframes panelFloat2{0%,100%{transform:rotate(24deg) translate3d(0,0,0);}50%{transform:rotate(19deg) translate3d(-14px,-22px,0);}}
@keyframes panelFloat3{0%,100%{transform:rotate(-12deg) translate3d(0,0,0);}50%{transform:rotate(-16deg) translate3d(12px,-14px,0);}}

/* Light beam */
.light-beam{
  position:absolute;width:150%;height:1.5px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,.05) 20%,
    rgba(255,180,220,.3) 48%,
    rgba(255,255,255,.5) 50%,
    rgba(200,180,255,.3) 52%,
    rgba(255,255,255,.05) 80%,
    transparent 100%);
  pointer-events:none;opacity:0;
  transform-origin:left center;
  will-change:opacity,transform;
}
.beam-1{top:18%;left:-30%;animation:beam1 16s ease-in-out infinite;}
.beam-2{top:70%;left:-30%;animation:beam2 22s ease-in-out infinite 3s;}
@keyframes beam1{0%,100%{opacity:0;transform:rotate(28deg) translateX(-30%);}50%{opacity:1;transform:rotate(28deg) translateX(0%);}}
@keyframes beam2{0%,100%{opacity:0;transform:rotate(-20deg) translateX(-30%);}50%{opacity:1;transform:rotate(-20deg) translateX(0%);}}

.grid-mesh{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 78%);
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 78%);
  pointer-events:none;
  opacity:.6;
}

/* Dust statis, tanpa animasi filter */
.particle-dust{
  position:absolute;inset:0;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, rgba(255,255,255,.85), transparent 60%),
    radial-gradient(1px 1px at 28% 48%, rgba(255,220,240,.7), transparent 60%),
    radial-gradient(1.8px 1.8px at 46% 16%, rgba(255,255,255,.8), transparent 60%),
    radial-gradient(1px 1px at 62% 36%, rgba(255,200,230,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 78% 26%, rgba(255,255,255,.85), transparent 60%),
    radial-gradient(1.1px 1.1px at 88% 52%, rgba(220,220,255,.7), transparent 60%),
    radial-gradient(1.6px 1.6px at 18% 72%, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1.3px 1.3px at 34% 86%, rgba(255,220,240,.7), transparent 60%),
    radial-gradient(1px 1px at 56% 78%, rgba(255,255,255,.8), transparent 60%),
    radial-gradient(1.6px 1.6px at 72% 92%, rgba(255,200,230,.75), transparent 60%),
    radial-gradient(1.1px 1.1px at 86% 76%, rgba(255,255,255,.65), transparent 60%),
    radial-gradient(1.4px 1.4px at 8% 92%, rgba(220,220,255,.7), transparent 60%),
    radial-gradient(1px 1px at 42% 58%, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1.5px 1.5px at 68% 8%, rgba(255,220,240,.85), transparent 60%),
    radial-gradient(1px 1px at 22% 8%, rgba(255,255,255,.65), transparent 60%),
    radial-gradient(1.3px 1.3px at 92% 30%, rgba(255,255,255,.8), transparent 60%);
  pointer-events:none;
  opacity:.85;
}

.vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 32%, rgba(5,2,14,.55) 100%);
  pointer-events:none;
}

/* ============================================================
   FLOATING DECOR
   ============================================================ */
.floaters{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.floater{
  position:absolute;bottom:-12vh;font-size:16px;opacity:0;
  animation:floatUp linear infinite;
  will-change:transform,opacity;
}
@keyframes floatUp{
  0%{transform:translate3d(0,0,0) rotate(0deg) scale(.7);opacity:0;}
  12%{opacity:.85;}
  85%{opacity:.65;}
  100%{transform:translate3d(var(--dx,20px),-118vh,0) rotate(var(--rot,120deg)) scale(1.05);opacity:0;}
}

/* ============================================================
   SLIDES
   ============================================================ */
#slides{
  position:fixed;inset:0;z-index:2;
  overflow-y:scroll;overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  overscroll-behavior-y:contain;
  touch-action:pan-y;
}
#slides::-webkit-scrollbar{display:none;}

.slide{
  position:relative;height:100vh;height:100dvh;
  scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  /* PADDING DISESUAIKAN: cukup buat topbar & mini-player, tapi tidak bikin konten terpotong */
  padding:calc(var(--safe-t) + 52px) 18px calc(96px + var(--safe-b));
  overflow:hidden;
  contain:layout style paint;
}

.intro-card{
  text-align:center;padding:34px 26px;border-radius:34px;
  background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1px solid var(--stroke);
  box-shadow:0 18px 44px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.24);
  max-width:330px;
  animation:cardIn .9s var(--ease) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.95);}to{opacity:1;transform:none;}}
.heart-emoji{
  font-size:58px;display:inline-block;
  animation:beat 1.5s ease-in-out infinite;
}
@keyframes beat{0%,100%{transform:scale(1);}14%{transform:scale(1.2);}28%{transform:scale(1);}42%{transform:scale(1.14);}56%{transform:scale(1);}}
.intro-title{
  font-family:"Dancing Script",cursive;font-size:42px;line-height:1.1;
  margin:10px 0 10px;
  background:linear-gradient(100deg,#fff,#ffc4dd 40%,#d8b4fe 75%,#fff);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.intro-sub{font-size:14px;line-height:1.7;color:var(--muted);letter-spacing:.2px;}
.intro-hint{
  margin-top:20px;font-size:11px;color:rgba(255,255,255,.5);
  letter-spacing:2px;text-transform:uppercase;
  animation:bob 2.2s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-6px);opacity:1;}}

.start-btn{
  margin-top:24px;display:flex;align-items:center;gap:10px;
  padding:15px 30px;border-radius:100px;
  font-size:15px;font-weight:600;letter-spacing:.3px;color:#fff;
  background:linear-gradient(120deg,#ff4d94,#a855f7);
  box-shadow:0 12px 32px rgba(255,77,148,.45), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .35s var(--spring), box-shadow .35s ease;
  animation:cardIn .9s .25s var(--ease) both;
}
.start-btn:active{transform:scale(.94);box-shadow:0 6px 20px rgba(255,77,148,.4);}

.photo-wrap{
  position:relative;display:flex;align-items:center;justify-content:center;
  transform:scale(.92) translateY(24px);opacity:0;
  transition:transform .9s var(--ease), opacity .7s ease;
}
.slide.active .photo-wrap{transform:none;opacity:1;}

.photo-card{
  position:relative;
  /* UKURAN DIPERKECIL SEDIKIT biar tidak kepotong di HP layar pendek */
  height:min(44dvh,330px);
  aspect-ratio:4/5;
  border-radius:26px;overflow:hidden;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);
  box-shadow:
    0 20px 46px rgba(0,0,0,.55),
    0 0 0 5px rgba(255,255,255,.04),
    0 0 50px rgba(255,95,162,.18);
  transition:transform .45s var(--spring);
}
.photo-card:active{transform:scale(.965);}
.photo-card img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease);}
.slide.active .photo-card img{transform:scale(1.05);}
.photo-card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,transparent 26%,transparent 68%,rgba(0,0,0,.32) 100%);
  pointer-events:none;
}
.shine{
  position:absolute;top:-120%;left:-60%;width:60%;height:340%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);
  transform:rotate(22deg);
  animation:shine 7s ease-in-out infinite;pointer-events:none;
}
@keyframes shine{0%{left:-70%;}55%{left:150%;}100%{left:150%;}}

.num-badge{
  position:absolute;top:-10px;left:-10px;min-width:40px;height:40px;padding:0 11px;
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(140deg,rgba(60,30,80,.85),rgba(40,20,60,.9));
  border:1px solid rgba(255,255,255,.26);
  box-shadow:0 8px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3);
  z-index:3;
}

.sticker{
  position:absolute;font-size:24px;pointer-events:none;
  animation:stickerFloat 5s ease-in-out infinite;z-index:3;
}
.sticker.s1{top:-22px;right:-14px;animation-delay:0s;}
.sticker.s2{bottom:-16px;left:-18px;animation-delay:.8s;font-size:28px;}
.sticker.s3{top:34%;right:-26px;animation-delay:1.6s;font-size:18px;}
.sticker.s4{bottom:26%;left:-24px;animation-delay:2.2s;font-size:20px;}
@keyframes stickerFloat{0%,100%{transform:translateY(0) rotate(-6deg) scale(1);}50%{transform:translateY(-9px) rotate(8deg) scale(1.08);}}

.caption{
  margin-top:22px;max-width:330px;text-align:center;
  font-size:13.5px;line-height:1.72;letter-spacing:.15px;
  color:rgba(255,255,255,.94);
  padding:14px 18px;border-radius:22px;
  background:linear-gradient(150deg,rgba(40,18,55,.62),rgba(20,8,35,.72));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 12px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.15);
  opacity:0;transform:translateY(18px);
  transition:opacity .75s .16s ease, transform .85s .16s var(--ease);
}
.slide.active .caption{opacity:1;transform:none;}
.caption .em{font-size:14.5px;margin-right:5px;}

.tap-hint{
  margin-top:12px;
  font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:rgba(255,255,255,.42);
  display:flex;align-items:center;gap:6px;
  opacity:0;transition:opacity .6s .4s ease;
}
.slide.active .tap-hint{opacity:1;}
.tap-hint::before,
.tap-hint::after{
  content:"";width:20px;height:1px;background:rgba(255,255,255,.2);
}

.outro-card{
  text-align:center;padding:38px 26px;border-radius:36px;
  background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1px solid var(--stroke);
  box-shadow:0 22px 56px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.26);
  max-width:330px;transform:scale(.93);opacity:0;
  transition:all .9s var(--ease);
}
.slide.active .outro-card{transform:none;opacity:1;}
.outro-title{
  font-family:"Dancing Script",cursive;font-size:38px;
  background:linear-gradient(100deg,#fff,#ffc4dd 45%,#d8b4fe);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:14px;line-height:1.1;
}
.outro-name{
  font-size:11.5px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.55);
  margin-bottom:18px;
}
.outro-text{font-size:13.5px;line-height:1.82;color:rgba(255,255,255,.86);}
.outro-hearts{font-size:26px;margin-top:18px;letter-spacing:5px;animation:beat 2s ease-in-out infinite;}
.outro-dates{
  display:flex;justify-content:center;gap:10px;
  margin-top:18px;flex-wrap:wrap;
}
.date-pill{
  font-size:11px;letter-spacing:1px;font-weight:600;
  padding:7px 13px;border-radius:100px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);
  color:rgba(255,255,255,.85);
}

.topbar{
  position:fixed;top:calc(var(--safe-t) + 12px);left:50%;
  transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:8px 15px;border-radius:100px;
  font-size:12px;font-weight:600;letter-spacing:.6px;
  background:rgba(30,12,45,.7);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2);
  transition:opacity .4s ease;
}
.topbar .dot{
  width:7px;height:7px;border-radius:50%;
  background:linear-gradient(140deg,#ff5fa2,#a855f7);
  animation:pulseDot 1.8s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:.7;}}

/* ============================================================
   MINI PLAYER
   ============================================================ */
.mini-player{
  position:fixed;left:12px;right:12px;
  bottom:max(12px, calc(var(--safe-b) + 8px));
  z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:10px 12px 10px 10px;border-radius:24px;
  background:linear-gradient(150deg,rgba(58,26,80,.92),rgba(28,12,45,.95));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 16px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.22);
  overflow:hidden;
  transition:transform .45s var(--spring), opacity .3s ease;
  animation:miniIn .8s .4s var(--ease) both;
  pointer-events:auto;
  isolation:isolate;
}
@keyframes miniIn{from{opacity:0;transform:translateY(120%);}to{opacity:1;transform:none;}}
.mini-player:active{transform:scale(.99);}
.mini-player.hidden{opacity:0;transform:translateY(140%);pointer-events:none;}

.mini-art{
  width:46px;height:46px;border-radius:13px;object-fit:cover;
  box-shadow:0 6px 16px rgba(0,0,0,.5);flex-shrink:0;
  background:linear-gradient(140deg,#ff4d94,#a855f7);
  transition:transform .4s var(--spring);
}
.mini-player.playing .mini-art{animation:artSpin 9s linear infinite;border-radius:50%;}
@keyframes artSpin{to{transform:rotate(360deg);}}

.mini-info{flex:1;min-width:0;overflow:hidden;}
.mini-title{font-size:13.5px;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.mini-bars{display:flex;align-items:flex-end;gap:2.5px;height:14px;margin-right:2px;}
.mini-bars span{width:3px;border-radius:2px;background:linear-gradient(180deg,#ff7ab8,#a855f7);animation:bar 1s ease-in-out infinite;height:5px;}
.mini-bars span:nth-child(2){animation-delay:.18s;}
.mini-bars span:nth-child(3){animation-delay:.36s;}
.mini-bars span:nth-child(4){animation-delay:.54s;}
.mini-player:not(.playing) .mini-bars span{animation-play-state:paused;height:5px !important;}
@keyframes bar{0%,100%{height:5px;}50%{height:14px;}}

.mini-btn{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  color:#fff;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.14);
  transition:transform .3s var(--spring), background .25s;
  position:relative;z-index:2;
}
.mini-btn:active{transform:scale(.88);background:rgba(255,255,255,.22);}
.mini-btn.primary{
  background:linear-gradient(140deg,#ff4d94,#a855f7);
  box-shadow:0 6px 18px rgba(255,77,148,.5), inset 0 1px 0 rgba(255,255,255,.4);
  border-color:transparent;
}
.mini-btn svg{width:18px;height:18px;}

.mini-progress{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:rgba(255,255,255,.08);}
.mini-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#ff4d94,#a855f7,#60a5fa);
  border-radius:2px;transition:width .25s linear;
}

/* ============================================================
   FULL PLAYER
   ============================================================ */
.full-player{
  position:fixed;inset:0;z-index:60;
  transform:translateY(101%);
  transition:transform .55s var(--ease);
  pointer-events:none;display:flex;flex-direction:column;overflow:hidden;
  will-change:transform;
}
.full-player.open{transform:translateY(0);pointer-events:auto;}

.fp-bg{
  position:absolute;inset:-10%;background-size:cover;background-position:center;
  filter:blur(48px) brightness(.5);
  transform:scale(1.15);
}

/* Intersection observer */
const counterText = document.getElementById('counterText');
const allSlides = slidesEl.querySelectorAll('.slide');

const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('active');
      const t = entry.target.dataset.type;
      if (t === 'photo') {
        const n = entry.target.dataset.photoIndex;
        counterText.textContent = `${String(n).padStart(2, '0')} / ${PHOTO_COUNT}`;
      } else if (t === 'intro') {
        counterText.textContent = 'Kenangan Kita';
      } else {
        counterText.textContent = 'Selesai 🤍';
      }
    } else {
      entry.target.classList.remove('active');
    }
  });
}, { root: slidesEl, threshold: 0.5 });

allSlides.forEach(s => io.observe(s));

const audio = new Audio();
audio.preload = 'metadata';
audio.volume = 0.85;

let currentIndex = 0;
let isSeeking = false;
let shuffleOn = false;
let repeatOn = false;

const miniPlayer = document.getElementById('miniPlayer');
const miniArt = document.getElementById('miniArt');
const miniTitle = document.getElementById('miniTitle');
const miniArtist = document.getElementById('miniArtist');
const miniFill = document.getElementById('miniFill');

const fullPlayer = document.getElementById('fullPlayer');
const fpBg = document.getElementById('fpBg');
const fpArt = document.getElementById('fpArt');
const fpTitle = document.getElementById('fpTitle');
const fpArtist = document.getElementById('fpArtist');
const fpFill = document.getElementById('fpFill');
const fpBar = document.getElementById('fpBar');
const fpCur = document.getElementById('fpCur');
const fpDur = document.getElementById('fpDur');
const fpPlayBtn = document.getElementById('fpPlay');
const fpPlayIcon = document.getElementById('fpPlayIcon');
const fpPlaylist = document.getElementById('fpPlaylist');
const fpCount = document.getElementById('fpCount');
const fpShuffle = document.getElementById('fpShuffle');
const fpRepeat = document.getElementById('fpRepeat');

const PLAY_PATH = "M8 5.14v13.72a1 1 0 0 0 1.54.84l10.3-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z";
const PAUSE_SVG = '<rect x="6" y="4.5" width="4" height="15" rx="1.6"/><rect x="14" y="4.5" width="4" height="15" rx="1.6"/>';

function setPlayIcons(playing) {
  miniPlayIcon.innerHTML = playing ? PAUSE_SVG : `<path d="${PLAY_PATH}"/>`;
  fpPlayIcon.innerHTML = playing ? PAUSE_SVG : `<path d="${PLAY_PATH}"/>`;
  miniPlayer.classList.toggle('playing', playing);
  fpArt.classList.toggle('playing', playing);
}

function fmt(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function loadSong(index, autoplay = true) {
  currentIndex = (index + SONGS.length) % SONGS.length;
  const song = SONGS[currentIndex];
  audio.src = song.src;
  audio.load();
  miniArt.src = song.cover;
  miniTitle.textContent = song.title;
  miniArtist.textContent = song.artist;
  fpArt.src = song.cover;
  fpTitle.textContent = song.title;
  fpArtist.textContent = song.artist;
  fpBg.style.backgroundImage = `url("${song.cover}")`;
  fpFill.style.width = '0%';
  miniFill.style.width = '0%';
  fpCur.textContent = '0:00';
  renderPlaylist();
  if (autoplay) {
    audio.play().then(() => setPlayIcons(true)).catch(() => setPlayIcons(false));
  } else {
    setPlayIcons(false);
  }
}

function togglePlay() {
  if (!audio.src) { loadSong(0); return; }
  if (audio.paused) {
    audio.play().then(() => setPlayIcons(true)).catch(() => toast('Klik sekali lagi untuk memutar 🎵'));
  } else {
    audio.pause();
    setPlayIcons(false);
  }
}

function nextSong() {
  if (shuffleOn && SONGS.length > 1) {
    let n; do { n = Math.floor(Math.random() * SONGS.length); } while (n === currentIndex);
    loadSong(n);
  } else {
    loadSong(currentIndex + 1);
  }
}

function prevSong() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  loadSong(currentIndex - 1);
}

audio.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  const d = audio.duration || 0;
  const p = d ? (audio.currentTime / d) * 100 : 0;
  fpFill.style.width = p + '%';
  miniFill.style.width = p + '%';
  fpCur.textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => { fpDur.textContent = fmt(audio.duration); });
audio.addEventListener('play', () => setPlayIcons(true));
audio.addEventListener('pause', () => setPlayIcons(false));
audio.addEventListener('ended', () => {
  if (repeatOn) { audio.currentTime = 0; audio.play(); }
  else nextSong();
});
audio.addEventListener('error', () => { setPlayIcons(false); toast('Lagu tidak dapat dimuat 😢'); });

miniPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
miniNextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextSong(); });
fpPlayBtn.addEventListener('click', togglePlay);
document.getElementById('fpNext').addEventListener('click', nextSong);
document.getElementById('fpPrev').addEventListener('click', prevSong);

fpShuffle.addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  fpShuffle.classList.toggle('on', shuffleOn);
  toast(shuffleOn ? 'Shuffle aktif 🔀' : 'Shuffle nonaktif');
});
fpRepeat.addEventListener('click', () => {
  repeatOn = !repeatOn;
  fpRepeat.classList.toggle('on', repeatOn);
  toast(repeatOn ? 'Ulang lagu aktif 🔁' : 'Ulang nonaktif');
});

function renderPlaylist() {
  fpCount.textContent = SONGS.length + ' lagu';
  fpPlaylist.innerHTML = '';
  SONGS.forEach((song, i) => {
    const btn = document.createElement('button');
    btn.className = 'pl-item' + (i === currentIndex ? ' active' : '');
    btn.innerHTML = `
      <img src="${song.cover}" alt="">
      <div class="pl-info">
        <div class="pl-title">${song.title}</div>
        <div class="pl-artist">${song.artist}</div>
      </div>
      ${i === currentIndex
        ? '<div class="pl-eq"><span></span><span></span><span></span><span></span></div>'
        : '<div class="pl-dur">♪</div>'}
    `;
    btn.addEventListener('click', () => {
      if (i === currentIndex) { togglePlay(); return; }
      loadSong(i);
      toast('Memutar: ' + song.title + ' 🎶');
    });
    fpPlaylist.appendChild(btn);
  });
}

function openFullPlayer() {
  fullPlayer.classList.add('open');
  miniPlayer.classList.add('hidden');
}
function closeFullPlayer() {
  fullPlayer.classList.remove('open');
  miniPlayer.classList.remove('hidden');
}

miniPlayer.addEventListener('click', (e) => {
  if (e.target.closest('.mini-btn')) return;
  openFullPlayer();
});

(function swipeClose() {
  const header = document.getElementById('fpHeader');
  let startY = 0, delta = 0, dragging = false;
  header.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY; delta = 0; dragging = true;
    fullPlayer.style.transition = 'none';
  }, { passive: true });
  header.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    delta = e.touches[0].clientY - startY;
    if (delta < 0) delta *= 0.28;
    fullPlayer.style.transform = `translateY(${delta}px)`;
  }, { passive: true });
  header.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    fullPlayer.style.transition = '';
    fullPlayer.style.transform = '';
    if (delta > 110) closeFullPlayer();
  });
})();

function seekFromEvent(clientX) {
  const rect = fpBar.getBoundingClientRect();
  let ratio = (clientX - rect.left) / rect.width;
  ratio = Math.max(0, Math.min(1, ratio));
  fpFill.style.width = (ratio * 100) + '%';
  if (audio.duration) {
    audio.currentTime = ratio * audio.duration;
    fpCur.textContent = fmt(audio.currentTime);
  }
}
fpBar.addEventListener('pointerdown', (e) => {
  isSeeking = true;
  fpBar.setPointerCapture(e.pointerId);
  seekFromEvent(e.clientX);
});
fpBar.addEventListener('pointermove', (e) => { if (isSeeking) seekFromEvent(e.clientX); });
const endSeek = (e) => {
  if (!isSeeking) return;
  isSeeking = false;
  try { fpBar.releasePointerCapture(e.pointerId); } catch (_) {}
};
fpBar.addEventListener('pointerup', endSeek);
fpBar.addEventListener('pointercancel', endSeek);

/* ============================================================
   CANVAS FIREWORKS
   ============================================================ */
const fxCanvas = document.getElementById('viewerFx');
const fxCtx = fxCanvas.getContext('2d');
let fxParticles = [];
let fxRaf = null;

function resizeFx() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  fxCanvas.width = window.innerWidth * dpr;
  fxCanvas.height = window.innerHeight * dpr;
  fxCanvas.style.width = window.innerWidth + 'px';
  fxCanvas.style.height = window.innerHeight + 'px';
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeFx);
resizeFx();

function drawHeartPath(ctx, x, y, s) {
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x, y - s * 0.55, x - s * 1.15, y + s * 0.05, x, y + s * 1.25);
  ctx.bezierCurveTo(x + s * 1.15, y + s * 0.05, x, y - s * 0.55, x, y + s * 0.35);
}

function firework(x, y, hue) {
  const count = 26 + Math.floor(Math.random() * 16);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - .5) * .4;
    const speed = 2 + Math.random() * 5;
    fxParticles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: .012 + Math.random() * .012,
      size: 2 + Math.random() * 3,
      color: `hsl(${hue + (Math.random() - .5) * 55}, 90%, ${62 + Math.random() * 20}%)`,
      gravity: .07,
      shape: Math.random() > .65 ? 'heart' : 'circle'
    });
  }
  startFx();
}

function startFx() { if (!fxRaf) tickFx(); }

function tickFx() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const p = fxParticles[i];
    p.vx *= 0.985;
    p.vy *= 0.985;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) { fxParticles.splice(i, 1); continue; }
    fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.fillStyle = p.color;
    fxCtx.beginPath();
    if (p.shape === 'heart') drawHeartPath(fxCtx, p.x, p.y, p.size);
    else fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    fxCtx.fill();
  }
  fxCtx.globalAlpha = 1;
  if (fxParticles.length > 0) fxRaf = requestAnimationFrame(tickFx);
  else { fxRaf = null; fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); }
}

const fxLayer = document.getElementById('viewerFxLayer');

function burstEmojis(originX, originY, opts = {}) {
  const emojis = opts.emojis || ['💗','🤍','✨','🌸','💖','💫','🎀','🌷'];
  const count = opts.count || 20;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'burst-emoji';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = originX + 'px';
    el.style.top = originY + 'px';
    el.style.fontSize = (14 + Math.random() * 20) + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 180;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist - 40;
    el.style.setProperty('--tx', tx + 'px');
    el.style.setProperty('--ty', ty + 'px');
    el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    el.style.animationDuration = (1.3 + Math.random() * 0.8) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2300);
  }
}

function launchLoveText(text, delay = 0) {
  setTimeout(() => {
    const el = document.createElement('div');
    el.className = 'love-text';
    el.textContent = text;
    el.style.left = (30 + Math.random() * 40) + '%';
    el.style.top = (50 + Math.random() * 20) + '%';
    el.style.fontSize = (24 + Math.random() * 18) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2700);
  }, delay);
}

function spawnPetals(count = 14) {
  const petals = ['🌸','🌺','🌷','💮','🏵️','💐','🍓','🦋','✨'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'petal';
    el.textContent = petals[Math.floor(Math.random() * petals.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (12 + Math.random() * 12) + 'px';
    el.style.animationDuration = (3.5 + Math.random() * 3) + 's';
    el.style.animationDelay = (Math.random() * 1.2) + 's';
    el.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    fxLayer.appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }
}

function launchFireworksSequence() {
  const w = window.innerWidth, h = window.innerHeight;
  firework(w * 0.5, h * 0.28, 330);
  setTimeout(() => firework(w * 0.22, h * 0.22, 290), 260);
  setTimeout(() => firework(w * 0.78, h * 0.25, 200), 480);
  setTimeout(() => firework(w * 0.5, h * 0.15, 15), 720);
  setTimeout(() => firework(w * 0.32, h * 0.35, 260), 940);
}

function launchLoveTexts() {
  const msgs = ['I Love You 💗', `${HER_NICK} 🤍`, 'Sayang Banget ✨', `${ANNIV} ♾️`, `${BIRTHDAY} 🎂`, 'Cinta Kamu 💖'];
  const shuffled = msgs.sort(() => Math.random() - .5);
  shuffled.forEach((m, i) => launchLoveText(m, i * 380));
}

/* ============================================================
   VIEWER
   ============================================================ */
const viewer = document.getElementById('viewer');
const viewerPhoto = document.getElementById('viewerPhoto');
const viewerCards = document.getElementById('viewerCards');
const viewerDots = document.getElementById('viewerDots');

let viewerOpen = false;

function getMessagesFor(photoIndex) {
  const i = photoIndex - 1;
  return [
    CAPTIONS[i],
    POOL_A[i % POOL_A.length],
    POOL_B[(i * 4 + 2) % POOL_B.length],
    POOL_C[(i * 7 + 5) % POOL_C.length],
    POOL_D[(i * 11 + 9) % POOL_D.length]
  ];
}

function buildCards(photoIndex) {
  const msgs = getMessagesFor(photoIndex);
  const emojis = ['💌','🌹','✨','💗','🫶'];
  viewerCards.innerHTML = '';
  msgs.forEach((m, idx) => {
    const card = document.createElement('div');
    card.className = 'viewer-card';
    card.style.animationDelay = (0.12 + idx * 0.08) + 's';
    card.innerHTML = `
      <div class="viewer-card-emoji">${emojis[idx % emojis.length]}</div>
      <div class="viewer-card-text">${m}</div>
      <div class="viewer-card-tag">
        <span>${String(idx + 1).padStart(2, '0')} / ${String(msgs.length).padStart(2, '0')}</span>
        <span class="tag-heart">🤍</span>
      </div>
    `;
    viewerCards.appendChild(card);
  });
  viewerDots.innerHTML = '';
  msgs.forEach((_, idx) => {
    const d = document.createElement('span');
    d.className = 'viewer-dot' + (idx === 0 ? ' active' : '');
    viewerDots.appendChild(d);
  });
  viewerCards.scrollLeft = 0;
}

function updateActiveDot() {
  const cards = viewerCards.querySelectorAll('.viewer-card');
  const dots = viewerDots.querySelectorAll('.viewer-dot');
  const cw = viewerCards.clientWidth;
  const scrollLeft = viewerCards.scrollLeft;
  let bestIdx = 0;
  let bestDist = Infinity;
  cards.forEach((c, i) => {
    const cardCenter = c.offsetLeft + c.offsetWidth / 2;
    const viewCenter = scrollLeft + cw / 2;
    const dist = Math.abs(cardCenter - viewCenter);
    if (dist < bestDist) { bestDist = dist; bestIdx = i; }
  });
  dots.forEach((d, i) => d.classList.toggle('active', i === bestIdx));
}

viewerCards.addEventListener('scroll', () => {
  if (!viewerOpen) return;
  requestAnimationFrame(updateActiveDot);
}, { passive: true });

viewerDots.addEventListener('click', (e) => {
  const dot = e.target.closest('.viewer-dot');
  if (!dot) return;
  const dots = Array.from(viewerDots.querySelectorAll('.viewer-dot'));
  const idx = dots.indexOf(dot);
  if (idx < 0) return;
  const cards = viewerCards.querySelectorAll('.viewer-card');
  const target = cards[idx];
  if (!target) return;
  const left = target.offsetLeft - (viewerCards.clientWidth - target.offsetWidth) / 2;
  viewerCards.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
});

function openViewer(photoIndex, imgEl) {
  if (viewerOpen) return;
  viewerOpen = true;

  const rect = imgEl.getBoundingClientRect();
  viewerPhoto.src = imgEl.src;
  buildCards(photoIndex);
  viewer.classList.add('open');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const targetRect = viewerPhoto.getBoundingClientRect();
      if (targetRect.width === 0) return;
      const dx = rect.left - targetRect.left;
      const dy = rect.top - targetRect.top;
      const sx = rect.width / targetRect.width;
      const sy = rect.height / targetRect.height;
      viewerPhoto.style.transition = 'none';
      viewerPhoto.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
      void viewerPhoto.offsetWidth;
      requestAnimationFrame(() => {
        viewerPhoto.style.transition = 'transform .65s cubic-bezier(.22,1,.36,1), border-radius .65s cubic-bezier(.22,1,.36,1)';
        viewerPhoto.style.transform = '';
      });
    });
  });

  setTimeout(() => {
    launchFireworksSequence();
    spawnPetals(14);
    burstEmojis(window.innerWidth * 0.5, window.innerHeight * 0.28, { count: 22 });
    launchLoveTexts();
  }, 320);

  setTimeout(() => {
    const pr = viewerPhoto.getBoundingClientRect();
    burstEmojis(pr.left + pr.width / 2, pr.top + pr.height / 2, {
      count: 14,
      emojis: ['✨','💫','💗','🤍']
    });
  }, 520);
}

function closeViewer() {
  if (!viewerOpen) return;
  viewerOpen = false;
  viewer.classList.remove('open');
  setTimeout(() => {
    viewerPhoto.style.transition = 'none';
    viewerPhoto.style.transform = '';
    viewerCards.innerHTML = '';
    viewerDots.innerHTML = '';
  }, 450);
  fxParticles = [];
}

slidesEl.addEventListener('click', (e) => {
  const card = e.target.closest('.photo-card');
  if (!card) return;
  const slide = card.closest('.slide');
  const idx = parseInt(slide.dataset.photoIndex, 10);
  const img = card.querySelector('img');
  if (img && idx) openViewer(idx, img);
});

document.getElementById('viewerClose').addEventListener('click', closeViewer);

viewer.addEventListener('click', (e) => {
  if (e.target === viewer || e.target.classList.contains('viewer-bg')) {
    closeViewer();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (viewerOpen) closeViewer();
    else if (fullPlayer.classList.contains('open')) closeFullPlayer();
  }
});

const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

document.getElementById('startBtn').addEventListener('click', () => {
  loadSong(0, true);
  burstEmojis(window.innerWidth * 0.5, window.innerHeight * 0.6, { count: 16 });
  const nextSlide = allSlides[1];
  if (nextSlide) {
    setTimeout(() => nextSlide.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
  }
});

(function init() {
  renderPlaylist();
  const first = SONGS[0];
  miniArt.src = first.cover;
  miniTitle.textContent = first.title;
  miniArtist.textContent = first.artist;
  fpArt.src = first.cover;
  fpTitle.textContent = first.title;
  fpArtist.textContent = first.artist;
  fpBg.style.backgroundImage = `url("${first.cover}")`;
  setTimeout(() => document.getElementById('splash').classList.add('hide'), 1000);
})();
</script>
